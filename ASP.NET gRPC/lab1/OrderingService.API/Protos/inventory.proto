syntax = "proto3";

option csharp_namespace = "InventoryService.gRPC";

package inventory;

service Inventory {
  rpc Deduct (DeductRequest) returns (DeductResponse);
}

message DeductRequest {
  repeated Item items = 1;
}

message Item {
  int32 id = 1;
  int32 quantity = 2;
}

message DeductResponse {
  bool success = 1;
  string message = 2;
}