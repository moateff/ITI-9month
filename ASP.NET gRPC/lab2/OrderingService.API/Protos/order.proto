syntax = "proto3";

option csharp_namespace = "OrderingService.API";

package order;

// The greeting service definition.
service Order {
  rpc Create (OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  int32 id = 1;
  int32 user_id = 2;
  repeated Item items = 3;
}

message OrderResponse {
  bool success = 1;
  string message = 2;
}

message Item {
  int32 id = 1;
  int32 price = 2;
  int32 quantity = 3;
}