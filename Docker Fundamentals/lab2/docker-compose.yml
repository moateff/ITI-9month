version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: P4sSw0rd0!
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"

  nginx:
    image: nginx:latest
    container_name: nginx-web
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:80"