<div class="container col-md-6">
  <h1 class="mb-4 text-center">Log In</h1>

  <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" class="row g-3">

    <div class="col-12">
      <label for="email" class="form-label">Email</label>

      <input
        type="email"
        class="form-control"
        id="email"
        placeholder="Enter your email"
        name="email"
        ngModel
        required
        email
        #email="ngModel"
      >

      @if(email.invalid && email.touched) {
        <small class="text-danger">Please enter a valid email</small>
      }
    </div>

    <div class="col-12">
      <label for="password" class="form-label">Password</label>

      <input
        type="password"
        class="form-control"
        id="password"
        placeholder="Enter your password"
        name="password"
        ngModel
        required
        minlength="6"
        #password="ngModel"
      >

      @if(password.invalid && password.touched) {
        <small class="text-danger">Password must be at least 6 characters</small>
      }
    </div>

    <div class="col-12">
      <div class="form-check">

        <input
          class="form-check-input"
          type="checkbox"
          id="remember"
          name="remember"
          ngModel
        >

        <label class="form-check-label" for="remember">Remember me</label>
      </div>
    </div>

    <div class="col-12 text-center">
      <button type="submit"
              class="btn btn-dark w-100"
              [disabled]="loginForm.invalid">
        Submit
      </button>
    </div>

  </form>
</div>

<div>
  <p class="text-center mt-4">
    Don't have an account? <a routerLink="/signup">Sign Up</a>
  </p>
</div>
