<div class="container col-md-6">
  <h1 class="mb-4 text-center">Log In</h1>

  <div class="row g-3">
    <div class="col-12">
      <label for="email" class="form-label">Email</label>
      <input [value]="loginData.email" (input)="loginData.email = $any($event.target).value" type="email" class="form-control" id="email" placeholder="Enter your email">
    </div>
    <div class="col-12">
      <label for="password" class="form-label">Password</label>
      <input [value]="loginData.password" (input)="loginData.password = $any($event.target).value" type="password" class="form-control" id="password" placeholder="Enter your password">
    </div>
    <div class="col-12">
      <div class="form-check">
        <input [value]="loginData.remember" (input)="loginData.remember = $any($event.target).checked" class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
    </div>
    <div class="col-12 text-center">
      <button (click)="login()" type="submit" class="btn btn-dark col-12">Submit</button>
    </div>
  </div>
</div>

<div>
  <p class="text-center mt-4">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
</div>
