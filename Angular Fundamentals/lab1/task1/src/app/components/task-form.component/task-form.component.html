<h1>Task Form</h1>

<div class="form">
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" [(ngModel)]="task.title">
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <input type="textarea" id="description" [(ngModel)]="task.description">
  </div>

  <div class="form-group">
    <label for="priority">Priority</label>
    <select id="priority" [(ngModel)]="task.priority">
      <option [ngValue]="PriorityEnum.LOW">LOW</option>
      <option [ngValue]="PriorityEnum.MEDIUM">MEDIUM</option>
      <option [ngValue]="PriorityEnum.HIGH">HIGH</option>
    </select>
  </div>

  <div class="form-group">
    <label for="dueDate">Due Date</label>
    <input type="date" id="dueDate" [(ngModel)]="task.dueDate">
  </div>

  <div class="form-group">
    <label for="category">Category</label>
    <select id="category" [(ngModel)]="task.category">
      <option [ngValue]="CategoryEnum.WORK">WORK</option>
      <option [ngValue]="CategoryEnum.PERSONAL">PERSONAL</option>
      <option [ngValue]="CategoryEnum.STUDY">STUDY</option>
    </select>
  </div>

  <div class="form-group">
    <label for="tags">Tags</label>
    <input type="textarea" id="tags" [(ngModel)]="tags">
  </div>

  <button (click)="addTask()">Add</button>
</div>
